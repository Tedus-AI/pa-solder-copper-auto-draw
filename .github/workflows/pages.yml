name: Deploy HTML CAD to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
      - 'cad-app/src/pa_cad/creo.py'
      - 'cad-app/src/pa_cad/resources/**'
      - 'cad-app/examples/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          TEST_OUTPUT: test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-browser-check
          path: web/test-results
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live-website:
    needs: deploy
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test actual public tool in Chromium
        run: npm run test:browser
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
          TEST_OUTPUT: test-results
          SMOKE_ONLY: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-website-browser-check
          path: web/test-results
          if-no-files-found: ignore
