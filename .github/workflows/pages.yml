name: Deploy HTML CAD to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
      - 'cad-app/src/pa_cad/creo.py'
      - 'cad-app/src/pa_cad/resources/**'
      - 'cad-app/examples/**'
  # Pull requests run the same build and browser checks, but never deploy.
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
      - 'cad-app/src/pa_cad/creo.py'
      - 'cad-app/src/pa_cad/resources/**'
      - 'cad-app/examples/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs must not cancel a main-branch deployment.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'github-pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        annotation_shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          TEST_OUTPUT: test-results
          ANNOTATION_SHARD_COUNT: '4'
          ANNOTATION_SHARD_INDEX: ${{ matrix.annotation_shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-browser-check-${{ matrix.annotation_shard }}
          path: web/test-results
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
        if: matrix.annotation_shard == 0 && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: matrix.annotation_shard == 0 && github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live-website:
    needs: deploy
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test actual public tool in Chromium
        run: npm run test:browser
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
          TEST_OUTPUT: test-results
          SMOKE_ONLY: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-website-browser-check
          path: web/test-results
          if-no-files-found: ignore
