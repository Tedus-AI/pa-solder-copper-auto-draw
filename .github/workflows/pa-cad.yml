name: PA CAD validation

on:
  push:
    branches: [main, deploy/pa-copper-preform-cad]
    # web/src is included: browser/Python parity and web DXF tests live here.
    paths: ['cad-app/**', 'web/src/**', 'web/package.json', 'web/package-lock.json', '.github/workflows/pa-cad.yml']
  pull_request:
    paths: ['cad-app/**', 'web/src/**', 'web/package.json', 'web/package-lock.json', '.github/workflows/pa-cad.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cad-app
    steps:
      - uses: actions/checkout@v4
      # Parity tests import web/src/*.js with Node; they need its dependencies.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cad-app/requirements.lock
      - run: python -m pip install -r requirements.lock -e '.[ui,dev]'
      - run: python -m pip check
      - run: python -m pytest -q
      - run: pa-cad examples/780-m1p.yaml -o output/ci
