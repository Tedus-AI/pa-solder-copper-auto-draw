name: PA CAD validation

on:
  push:
    branches: [deploy/pa-copper-preform-cad]
    paths: ['cad-app/**', '.github/workflows/pa-cad.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cad-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cad-app/requirements.lock
      - run: python -m pip install -r requirements.lock -e '.[ui,dev]'
      - run: python -m pip check
      - run: python -m pytest -q
      - run: pa-cad examples/780-m1p.yaml -o output/ci
