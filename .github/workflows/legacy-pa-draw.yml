name: Legacy pa-draw CLI

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'examples/**', 'pyproject.toml', '.github/workflows/legacy-pa-draw.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'examples/**', 'pyproject.toml', '.github/workflows/legacy-pa-draw.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: pa-draw examples/pa_example.yaml -o output/ci
